<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShipSignal</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0d10'/%3E%3Cpath d='M7 21 L13 17 L17 19 L22 12 L26 10' stroke='%234f8cff' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='26' cy='10' r='2.6' fill='%236ee7b7'/%3E%3C/svg%3E"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        background: #0b0d10;
        color-scheme: dark;
      }
      html[data-theme="light"] body {
        background: #f6f7f9;
        color-scheme: light;
      }
      #boot-splash {
        display: flex;
        height: 100vh;
        width: 100vw;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }
      #boot-splash .logo {
        display: flex;
        height: 44px;
        width: 44px;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        background: #4f8cff;
        color: #ffffff;
        font-weight: 700;
        font-size: 20px;
        letter-spacing: 0.5px;
      }
      #boot-splash .hint {
        font-size: 12px;
        color: #8b93a1;
      }
      html[data-theme="light"] #boot-splash .hint {
        color: #6b7280;
      }
    </style>
    <script>
      // 在最早时机应用主题，避免启动屏闪烁
      (function () {
        try {
          var stored = localStorage.getItem("shipssignal-theme");
          var theme = stored === "light" ? "light" : "dark";
          // 如果没存过，跟随系统
          if (!stored) {
            var prefersDark = window.matchMedia(
              "(prefers-color-scheme: dark)"
            ).matches;
            theme = prefersDark ? "dark" : "light";
          }
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash">
        <div class="logo">S</div>
        <div class="hint">正在启动 ShipSignal…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
